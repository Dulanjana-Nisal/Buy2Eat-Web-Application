name: Buy2Eat Application

services:
  mongodb: 
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - buy2eat-network
    volumes:
      - mongo_data:/data/db
    
  mongo-express:
    image: mongo-express:1.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${ME_CONFIG_MONGODB_ADMINUSERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${ME_CONFIG_MONGODB_ADMINPASSWORD}
      ME_CONFIG_MONGODB_SERVER: ${ME_CONFIG_MONGODB_SERVER}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    networks:
      - buy2eat-network
    depends_on:
      - mongodb

  api:
    build:  
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file:
      ./backend/.env.development.local
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/buy2eat?authSource=admin
      PORT: 5000
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - buy2eat-network
    depends_on:
      - mongodb
      - mongo-express

networks :
  buy2eat-network: 
    driver: bridge

volumes:
  mongo_data:
