name: Buy2Eat Application

services:
  mongodb: 
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - .env.compose.local
    networks:
      - buy2eat-network
    volumes:
      - mongo_data:/data/db
    
  mongo-express:
    image: mongo-express:1.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.compose.local
    networks:
      - buy2eat-network
    depends_on:
      - mongodb

  api:
    build:  
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file: 
      - ./.env.compose.local
      - ./backend/.env.development.local
    environment:
      PORT: 5000
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - buy2eat-network
    depends_on:
      - mongodb
      - mongo-express

networks :
  buy2eat-network: 
    driver: bridge

volumes:
  mongo_data:
