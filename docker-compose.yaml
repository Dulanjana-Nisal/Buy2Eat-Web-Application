name: Buy2Eat Application

services:
  mongodb: 
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    env_file:
      - .env.compose.local
    networks:
      - buy2eat-network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]})
          }"
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongo_data:/data/db
    
  mongo-express:
    image: mongo-express:1.0
    restart: unless-stopped
    ports:
      - "8080:8081"
    env_file:
      - .env.compose.local
    networks:
      - buy2eat-network
    depends_on:
      - mongodb

  api:
    build:  
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file: 
      - ./.env.compose.local
      - ./backend/.env.development.local
    environment:
      PORT: 5000
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - buy2eat-network
    depends_on:
      - mongodb
      - mongo-express

networks :
  buy2eat-network: 
    driver: bridge

volumes:
  mongo_data:
